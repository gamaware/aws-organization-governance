name: 'Terraform Composite Action'
description: 'Reusable composite action for Terraform operations'

inputs:
  terraform_version:
    description: 'Terraform version to use'
    required: false
    default: '1.14.5'
  working_directory:
    description: 'Directory containing Terraform configuration'
    required: true
  terraform_command:
    description: 'Terraform command to run (init, plan, apply)'
    required: true
  aws_region:
    description: 'AWS region'
    required: false
    default: 'us-east-1'
  aws_role_arn:
    description: 'AWS IAM role ARN for OIDC authentication'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.aws_region }}
        role-session-name: GitHubActions-Terraform-${{ github.run_id }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Cache Terraform providers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.working_directory }}/.terraform/providers
        key: terraform-providers-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working_directory)) }}
        restore-keys: |
          terraform-providers-${{ runner.os }}-

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform init

    - name: Terraform Format Check
      if: inputs.terraform_command == 'plan'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform validate

    - name: Terraform Plan
      if: inputs.terraform_command == 'plan'
      id: plan
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: ${{ github.workspace }}/.github/scripts/terraform-plan.sh

    - name: Upload Plan Artifact
      if: inputs.terraform_command == 'plan'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: terraform-plan
        path: |
          ${{ inputs.working_directory }}/tfplan
          ${{ inputs.working_directory }}/plan.txt
        retention-days: 3

    - name: Comment Plan on PR
      if: inputs.terraform_command == 'plan' && github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
      with:
        script: |
          const fs = require('fs');
          const planPath = `${process.env.WORKING_DIRECTORY}/plan.txt`;
          let planOutput = '';
          try {
            planOutput = fs.readFileSync(planPath, 'utf8');
          } catch (e) {
            planOutput = 'Plan output not available.';
          }

          // Truncate if too long (GitHub comment limit is 65536 chars)
          const maxLen = 60000;
          if (planOutput.length > maxLen) {
            planOutput = planOutput.substring(0, maxLen) + '\n\n... (truncated)';
          }

          const body = [
            '### Terraform Plan Output',
            '',
            '<details>',
            '<summary>Click to expand plan</summary>',
            '',
            '```terraform',
            planOutput,
            '```',
            '',
            '</details>',
            '',
            `*Workflow: \`${context.workflow}\` | Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`,
          ].join('\n');

          // Paginate to find existing bot comment
          const comments = await github.paginate(
            github.rest.issues.listComments,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            }
          );

          const botComment = comments.find(c =>
            c.user.type === 'Bot' && c.body.includes('### Terraform Plan Output')
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Download Plan Artifact
      if: inputs.terraform_command == 'apply'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: terraform-plan
        path: ${{ inputs.working_directory }}

    - name: Terraform Apply
      if: inputs.terraform_command == 'apply'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform apply -auto-approve tfplan

    - name: Terraform Destroy Plan Preview
      if: inputs.terraform_command == 'destroy'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set +e
        terraform plan -destroy -detailed-exitcode -no-color 2>&1 | tee destroy-plan.txt
        EXIT_CODE=$?
        set -e

        {
          echo "## Terraform Destroy Plan Preview"
          echo ""
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "✅ **No resources to destroy.** Infrastructure is clean."
          elif [ "$EXIT_CODE" -eq 2 ]; then
            DESTROY_COUNT=$(grep -c "will be destroyed" destroy-plan.txt || true)
            echo "⚠️ **$DESTROY_COUNT resource(s) will be destroyed.**"
            echo ""
            echo "| Resource |"
            echo "| -------- |"
            grep "will be destroyed" destroy-plan.txt \
              | sed 's/^.*# //' | sed 's/ will be destroyed//' \
              | while IFS= read -r line; do echo "| \`$line\` |"; done
          else
            echo "❌ **Destroy plan failed.** Check the logs."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$EXIT_CODE" -eq 1 ]; then exit 1; fi

    - name: Terraform Destroy
      if: inputs.terraform_command == 'destroy'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform destroy -auto-approve
