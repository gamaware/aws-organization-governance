# -----------------------------------------------------------------
# Update Pre-commit Hooks — weekly auto-update of hook versions
#
# Runs on: weekly Sunday at 00:00 UTC, manual dispatch
# Jobs: updates .pre-commit-config.yaml and creates PR
# -----------------------------------------------------------------
name: Update Pre-commit Hooks
run-name: "Update Pre-commit Hooks (${{ github.event_name }})"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: pre-commit-update
  cancel-in-progress: false

jobs:
  update-hooks:
    name: Update Pre-commit Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same environment as auto-merge-bot-prs.yml: no protection rules, only
    # there so PRE_COMMIT_PAT is read inside a job environment (zizmor
    # secrets-outside-env). GitHub creates it on first use.
    environment: automation
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update Hooks
        uses: ./.github/actions/update-pre-commit-composite
        with:
          github_token: ${{ secrets.PRE_COMMIT_PAT }}
