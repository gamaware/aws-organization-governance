name: 'Lint and Security Scan Composite Action'
description: 'Runs Terraform linting and security scanning on PRs'

inputs:
  terraform_version:
    description: 'Terraform version to use'
    required: false
    default: '1.14.5'
  working_directory:
    description: 'Directory containing Terraform configuration'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Terraform Format Check
      shell: bash
      run: terraform fmt -check -recursive
      working-directory: ${{ inputs.working_directory }}

    - name: TFLint Setup
      uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
      with:
        tflint_version: latest

    - name: Run TFLint
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        tflint --init
        tflint --recursive

    - name: Checkov Security Scan
      uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 # v12.3123.0
      with:
        directory: ${{ inputs.working_directory }}
        framework: terraform
        soft_fail: false
